    supervised_allowed: false
    leakage_risk: high
    known_at_inference: true

  - name: jours_depuis_bodacc
    sources: [jours_depuis_bodacc]
    description: "Days since the last BODACC announcement — often the dissolution event itself."
    type: numeric
    supervised_allowed: false
    leakage_risk: high
    known_at_inference: true

  - name: flag_cession_bodacc
    sources: [flag_cession_bodacc]
    description: "1 if a cession announcement exists — effectively the event."
    type: numeric
    supervised_allowed: false
    leakage_risk: high
    known_at_inference: true
