  # -------- EXCLUDED FROM SUPERVISED (high leakage) ---------------------------
  - name: pas_representant_actif
    sources: [nombreRepresentantsActifs]
    description: "1 if no active representative."
    type: numeric
    supervised_allowed: false
    leakage_risk: high
    known_at_inference: true
    physique_only: true

  - name: capital_absent
    sources: [identite.montantCapital]
    description: "1 if capital is missing. Often wiped AFTER cessation."
