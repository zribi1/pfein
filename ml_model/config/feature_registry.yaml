# =============================================================================
# Feature Registry
# -----------------------------------------------------------------------------
# Single source of truth for every feature the pipeline knows about.
#
# Fields:
#   name               : column name as emitted by feature_engineering.build_features
#   sources            : raw columns this feature derives from
#   description        : plain-English explanation
#   type               : numeric | categorical
#   supervised_allowed : can be used by the supervised model?
#   leakage_risk       : low | medium | high (why, if not low, see note)
#   known_at_inference : available when scoring a live company?
#   physique_only      : reserved for the rule-based physique score?
#   anomaly            : used by the IsolationForest auxiliary signal?
# =============================================================================

features:

  # -------- raw columns passed through ----------------------------------------
  - name: age_ans
    sources: [age_ans]
    description: "Company age in years."
    type: numeric
    supervised_allowed: true
    leakage_risk: low
    known_at_inference: true
    anomaly: true

  - name: jours_depuis_update
    sources: [jours_depuis_update]
    description: "Days since the record was last updated."
    type: numeric
    supervised_allowed: true
    leakage_risk: medium      # correlated with observation_date; used for split
    known_at_inference: true

  - name: nb_etab_secondaires
    sources: [nb_etab_secondaires]
    description: "Number of secondary establishments."
    type: numeric
    supervised_allowed: true
    leakage_risk: low
    known_at_inference: true

  - name: nb_etab_fermes
    sources: [nb_etab_fermes]
    description: "Number of closed establishments."
    type: numeric
    supervised_allowed: true
    leakage_risk: low
    known_at_inference: true

  - name: nb_representants_extraits
